services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: job_match
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d job_match"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      PORT: 3000
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/job_match
      SKILLS_WEIGHT: 50
      EXPERIENCE_WEIGHT: 20
      LOCATION_WEIGHT: 15
      SALARY_WEIGHT: 15
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
